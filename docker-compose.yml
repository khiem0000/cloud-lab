
services:

  # Câu 81: Khai báo Backend Service
  backend:
    build:
      context: ./mern-demo/server
      dockerfile: Dockerfile

    # Câu 83: Cấu hình port Backend
    ports:
      - "5001:5000"

    # Câu 85: Nạp biến môi trường MongoDB Atlas
    env_file:
      - ./mern-demo/server/.env

    restart: unless-stopped

  # Câu 82: Khai báo Frontend Service
  frontend:
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile

    # Câu 84: Cấu hình port Frontend
    ports:
      - "8080:4173"

    # Kết nối API tới Backend Service
    environment:
      API_PROXY_TARGET: "http://backend:5000"

    depends_on:
      - backend

    restart: unless-stopped
