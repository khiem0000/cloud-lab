
name: cloud-lab-codespaces

services:
  backend:
    image: khiewcokk/mern-backend:1.0

    network_mode: host

    environment:
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI secret is required}

    restart: unless-stopped

  frontend:
    image: khiewcokk/mern-frontend:2.0

    network_mode: host

    environment:
      API_PROXY_TARGET: "http://127.0.0.1:5000"

    command:
      - npm
      - run
      - preview
      - --
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    depends_on:
      - backend

    restart: unless-stopped
